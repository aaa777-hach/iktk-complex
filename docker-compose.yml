# ============================================================
# Инфраструктура iktk-complex
# Запуск:    docker compose up -d
# Остановка: docker compose down
# Логи:      docker compose logs -f
# ============================================================

services:

  postgres:
    image: postgres:16-alpine
    container_name: iktk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-iktk_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-iktk_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-iktk}
    ports:
      - "5432:5432"
    volumes:
      - iktk-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-iktk_app}"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: iktk-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-iktk}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-iktk_dev_password}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/iktk}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - iktk-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: iktk-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - iktk-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: pgsty/minio:latest
    container_name: iktk-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - iktk-minio-data:/data
    command: server /data --console-address ":9001"

volumes:
  iktk-postgres-data:
  iktk-rabbitmq-data:
  iktk-redis-data:
  iktk-minio-data: