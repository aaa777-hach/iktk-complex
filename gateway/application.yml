server:
  port: 8080

spring:
  main:
    allow-bean-definition-overriding: true

  application:
    name: gateway

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

iktk:
  gateway:
    auth-uri: ${AUTH_URI:http://localhost:8081}
    orchestrator-uri: ${ORCHESTRATOR_URI:http://localhost:8082}
    equipment-uri: ${EQUIPMENT_URI:http://localhost:8094}
    bom-uri: ${BOM_URI:http://localhost:8095}
    assembly-uri: ${ASSEMBLY_URI:http://localhost:8096}
    recommendation-uri: ${RECOMMENDATION_URI:http://localhost:8097}
    cors-allowed-origins:
      - http://localhost
      - http://localhost:80
      - http://localhost:3000
      - http://localhost:5173
    rate-limit-replenish: 100
    rate-limit-burst: 200

  security:
    jwt:
      secret: ${IKTK_JWT_SECRET:change-me-super-secret-key-for-dev-only-min-32-bytes-long-0123456789}
      issuer: ${IKTK_JWT_ISSUER:iktk}