server:
  port: 8081

spring:
  application:
    name: auth

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/iktk_auth
    username: ${POSTGRES_USER:iktk_app}
    password: ${POSTGRES_PASSWORD:iktk_dev_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:iktk}
    password: ${RABBITMQ_PASSWORD:iktk_dev_password}
    virtual-host: ${RABBITMQ_VHOST:/iktk}

iktk:
  security:
    jwt:
      secret: ${IKTK_JWT_SECRET:change-me-super-secret-key-for-dev-only-min-32-bytes-long-0123456789}
      issuer: ${IKTK_JWT_ISSUER:iktk}