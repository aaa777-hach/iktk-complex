# =============================================================================
# ИКТК: Kubernetes-манифест для PostgreSQL
# Путь: deployment/k8s/postgres-statefulset.yaml
# Назначение: развёртывание СУБД PostgreSQL 16 с постоянным хранилищем,
#             резервным копированием, мониторингом и защитой.
# =============================================================================

# -----------------------------------------------------------------------------
# 1. Secret (шаблон — заполняется через CI/CD или Sealed Secrets)
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secrets
  namespace: iktk
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: iktk-complex
type: Opaque
stringData:
  POSTGRES_DB: "iktk"
  POSTGRES_USER: "iktk_app"
  POSTGRES_PASSWORD: "CHANGE_ME_STRONG_PASSWORD"
  REPLICATION_USER: "iktk_repl"
  REPLICATION_PASSWORD: "CHANGE_ME_STRONG_PASSWORD"

---
# -----------------------------------------------------------------------------
# 2. ConfigMap — параметры PostgreSQL
# -----------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
  namespace: iktk
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: iktk-complex
data:
  # ---- Общие параметры -----------------------------------------------------
  POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=C.UTF-8 --data-checksums"
  PGDATA: "/var/lib/postgresql/data/pgdata"
  TZ: "Europe/Moscow"

  # ---- Конфигурация PostgreSQL --------------------------------------------
  postgresql.conf: |
    # --- Соединения --------------------------------------------------------
    listen_addresses = '*'
    port = 5432
    max_connections = 200
    superuser_reserved_connections = 3

    # --- Память ------------------------------------------------------------
    shared_buffers = 512MB
    effective_cache_size = 1536MB
    work_mem = 8MB
    maintenance_work_mem = 128MB

    # --- WAL и контрольные точки ------------------------------------------
    wal_level = replica
    max_wal_size = 2GB
    min_wal_size = 256MB
    checkpoint_completion_target = 0.9
    wal_buffers = 16MB
    wal_compression = on
    archive_mode = on
    archive_command = 'test ! -f /var/lib/postgresql/archive/%f && cp %p /var/lib/postgresql/archive/%f'

    # --- Планировщик -------------------------------------------------------
    random_page_cost = 1.1
    effective_io_concurrency = 200
    default_statistics_target = 100

    # --- Параллелизм -------------------------------------------------------
    max_worker_processes = 8
    max_parallel_workers_per_gather = 4
    max_parallel_workers = 8
    max_parallel_maintenance_workers = 4

    # --- Логирование -------------------------------------------------------
    log_destination = 'stderr'
    logging_collector = off
    log_min_duration_statement = 1000
    log_checkpoints = on
    log_connections = off
    log_disconnections = off
    log_lock_waits = on
    log_temp_files = 0
    log_autovacuum_min_duration = 0
    log_line_prefix = '%m [%p] %q%u@%d '
    log_timezone = 'Europe/Moscow'

    # --- Autovacuum --------------------------------------------------------
    autovacuum = on
    autovacuum_max_workers = 4
    autovacuum_naptime = 30s
    autovacuum_vacuum_scale_factor = 0.1
    autovacuum_analyze_scale_factor = 0.05

    # --- Расширения --------------------------------------------------------
    shared_preload_libraries = 'pg_stat_statements'
    pg_stat_statements.max = 10000
    pg_stat_statements.track = all

    # --- Таймзона ----------------------------------------------------------
    timezone = 'Europe/Moscow'

  pg_hba.conf: |
    # TYPE  DATABASE        USER            ADDRESS                 METHOD
    local   all             all                                     trust
    host    all             all             127.0.0.1/32            scram-sha-256
    host    all             all             ::1/128                 scram-sha-256
    host    all             all             10.0.0.0/8              scram-sha-256
    host    all             all             172.16.0.0/12           scram-sha-256
    host    all             all             192.168.0.0/16          scram-sha-256
    host    replication     iktk_repl       10.0.0.0/8              scram-sha-256
    host    replication     iktk_repl       172.16.0.0/12           scram-sha-256

  # ---- Скрипт инициализации -----------------------------------------------
  01-init.sql: |
    -- Дополнительные расширения
    CREATE EXTENSION IF NOT EXISTS pg_stat_statements;
    CREATE EXTENSION IF NOT EXISTS pg_trgm;
    CREATE EXTENSION IF NOT EXISTS btree_gin;
    CREATE EXTENSION IF NOT EXISTS pgcrypto;

    -- Роли приложений
    DO $$
    BEGIN
        IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'iktk_read') THEN
            CREATE ROLE iktk_read NOLOGIN;
        END IF;
        IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'iktk_migrate') THEN
            CREATE ROLE iktk_migrate NOLOGIN;
        END IF;
    END $$;

    GRANT iktk_read TO iktk_app;
    GRANT iktk_migrate TO iktk_app;

---
# -----------------------------------------------------------------------------
# 3. Headless Service (для StatefulSet)
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: postgres-headless
  namespace: iktk
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: iktk-complex
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      protocol: TCP

---
# -----------------------------------------------------------------------------
# 4. Service (ClusterIP) — основной доступ
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: iktk
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: iktk-complex
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      protocol: TCP
  sessionAffinity: None

---
# -----------------------------------------------------------------------------
# 5. StatefulSet
# -----------------------------------------------------------------------------
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: iktk
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: iktk-complex
    app.kubernetes.io/version: "16"
spec:
  serviceName: postgres-headless
  replicas: 1
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: iktk-complex
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9187"
        prometheus.io/path: "/metrics"
    spec:
      # ---- Безопасность -------------------------------------------------
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault

      # ---- Приоритет ----------------------------------------------------
      priorityClassName: iktk-critical

      # ---- Сервисный аккаунт --------------------------------------------
      serviceAccountName: postgres-sa
      automountServiceAccountToken: false

      # ---- Параметры завершения -----------------------------------------
      terminationGracePeriodSeconds: 120

      # ---- Основные контейнеры ------------------------------------------
      containers:
        # --- PostgreSQL ---------------------------------------------------
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent

          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP

          envFrom:
            - configMapRef:
                name: postgres-config
            - secretRef:
                name: postgres-secrets

          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata

          # ---- Ресурсы ---------------------------------------------------
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "2Gi"

          # ---- Проверки --------------------------------------------------
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 30
            timeoutSeconds: 5

          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
            timeoutSeconds: 5

          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5

          # ---- Монтирование томов ---------------------------------------
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: archive
              mountPath: /var/lib/postgresql/archive
            - name: config
              mountPath: /etc/postgresql/conf.d
              readOnly: true
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: run
              mountPath: /var/run/postgresql

          # ---- Безопасность контейнера ----------------------------------
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL

        # --- postgres_exporter (метрики для Prometheus) ------------------
        - name: postgres-exporter
          image: prometheuscommunity/postgres-exporter:v0.15.0
          imagePullPolicy: IfNotPresent

          ports:
            - name: metrics
              containerPort: 9187
              protocol: TCP

          env:
            - name: DATA_SOURCE_NAME
              valueFrom:
                secretKeyRef:
                  name: postgres-exporter-secret
                  key: DATA_SOURCE_NAME
            - name: PG_EXPORTER_AUTO_DISCOVER_DATABASES
              value: "true"
            - name: PG_EXPORTER_EXTEND_QUERY_PATH
              value: "/etc/postgres-exporter/queries.yaml"

          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"

          livenessProbe:
            httpGet:
              path: /health
              port: metrics
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 10

          volumeMounts:
            - name: exporter-config
              mountPath: /etc/postgres-exporter
              readOnly: true

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

      # ---- Тома (для ConfigMap/Secret, не для данных) -------------------
      volumes:
        - name: config
          configMap:
            name: postgres-config
            items:
              - key: postgresql.conf
                path: postgresql.conf
              - key: pg_hba.conf
                path: pg_hba.conf
        - name: init-scripts
          configMap:
            name: postgres-config
            items:
              - key: 01-init.sql
                path: 01-init.sql
        - name: exporter-config
          configMap:
            name: postgres-exporter-config
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
        - name: run
          emptyDir:
            sizeLimit: 64Mi

  # ---- Постоянное хранилище (PVC) -------------------------------------
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: postgres
          app.kubernetes.io/component: database
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: iktk-ssd
        resources:
          requests:
            storage: 50Gi
    - metadata:
        name: archive
        labels:
          app.kubernetes.io/name: postgres
          app.kubernetes.io/component: wal-archive
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: iktk-standard
        resources:
          requests:
            storage: 20Gi

---
# -----------------------------------------------------------------------------
# 6. ServiceAccount
# -----------------------------------------------------------------------------
apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres-sa
  namespace: iktk
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: iktk-complex
automountServiceAccountToken: false

---
# -----------------------------------------------------------------------------
# 7. PodDisruptionBudget
# -----------------------------------------------------------------------------
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: postgres-pdb
  namespace: iktk
  labels:
    app.kubernetes.io/name: postgres
spec:
  maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres

---
# -----------------------------------------------------------------------------
# 8. NetworkPolicy
# -----------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-netpol
  namespace: iktk
  labels:
    app.kubernetes.io/name: postgres
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgres
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Трафик от всех сервисов ИКТК
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: iktk-complex
      ports:
        - protocol: TCP
          port: 5432
    # Метрики для Prometheus
    - from:
        - namespaceSelector:
            matchLabels:
              name: monitoring
      ports:
        - protocol: TCP
          port: 9187
  egress:
    # DNS
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

---
# -----------------------------------------------------------------------------
# 9. ConfigMap для postgres_exporter
# -----------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-exporter-config
  namespace: iktk
  labels:
    app.kubernetes.io/name: postgres
data:
  queries.yaml: |
    iktk_projects:
      query: "SELECT status, COUNT(*) AS count FROM iktk.projects GROUP BY status"
      metrics:
        - status:
            usage: "LABEL"
            description: "Статус проекта"
        - count:
            usage: "GAUGE"
            description: "Количество проектов по статусам"

    iktk_processes:
      query: "SELECT process_type, status, COUNT(*) AS count FROM iktk.technology_processes GROUP BY process_type, status"
      metrics:
        - process_type:
            usage: "LABEL"
        - status:
            usage: "LABEL"
        - count:
            usage: "GAUGE"

    iktk_versions:
      query: "SELECT entity_type, COUNT(*) AS count FROM iktk.entity_versions WHERE is_current = FALSE GROUP BY entity_type"
      metrics:
        - entity_type:
            usage: "LABEL"
        - count:
            usage: "GAUGE"

    iktk_audit_recent:
      query: "SELECT result, COUNT(*) AS count FROM iktk_audit.audit_log WHERE created_at > NOW() - INTERVAL '1 hour' GROUP BY result"
      metrics:
        - result:
            usage: "LABEL"
        - count:
            usage: "GAUGE"

---
# -----------------------------------------------------------------------------
# 10. Secret для postgres_exporter (DSN)
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: postgres-exporter-secret
  namespace: iktk
  labels:
    app.kubernetes.io/name: postgres
type: Opaque
stringData:
  # Формат: postgresql://user:password@host:port/dbname?sslmode=disable
  DATA_SOURCE_NAME: "postgresql://iktk_app:CHANGE_ME_STRONG_PASSWORD@localhost:5432/iktk?sslmode=disable"

---
# -----------------------------------------------------------------------------
# 11. ServiceMonitor (для Prometheus Operator — опционально)
# -----------------------------------------------------------------------------
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: postgres-monitor
  namespace: iktk
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: iktk-complex
    release: prometheus
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s