name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        id: mvn
        continue-on-error: true
        run: |
          mvn -B -Duser.language=en -Duser.country=US clean verify 2>&1 | tee mvn.log

      - name: Show failures
        if: steps.mvn.outcome == 'failure'
        run: |
          echo "=== SUREFIRE REPORTS ==="
          find . -path '*/target/surefire-reports/*.txt' -print -exec cat {} \; || true
          echo ""
          echo "=== TAIL OF MVN LOG (last 200 lines) ==="
          tail -200 mvn.log || true

      - name: Fail build
        if: steps.mvn.outcome == 'failure'
        run: exit 1
      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports'
          if-no-files-found: ignore
      - name: Upload JaCoCo reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-reports
          path: '**/target/site/jacoco'
          if-no-files-found: ignore