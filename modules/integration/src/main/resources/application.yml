server:
  port: ${SERVER_PORT:8092}

spring:
  application:
    name: integration
  datasource:
    url: ${GEOMETRY_DB_URL:jdbc:postgresql://localhost:5432/iktk_geometry}
    username: ${GEOMETRY_DB_USER:iktk_app}
    password: ${GEOMETRY_DB_PASSWORD:iktk_dev_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: INFO
    ru.iktk: INFO
