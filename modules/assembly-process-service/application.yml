server:
  port: 8096

spring:
  application:
    name: assembly-process-service

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/iktk_assembly
    username: ${POSTGRES_USER:iktk_app}
    password: ${POSTGRES_PASSWORD:iktk_dev_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:iktk}
    password: ${RABBITMQ_PASSWORD:iktk_dev_password}
    virtual-host: ${RABBITMQ_VHOST:/iktk}
    listener:
      simple:
        missing-queues-fatal: false

iktk:
  assembly:
    demo-fallback: false
    default-strategy: SEQUENTIAL
  equipment:
    url: http://localhost:8094
  integration:
    url: http://localhost:8095
  messaging:
    commands-queue: iktk.assembly-process-service.queue
    results-queue: iktk.results