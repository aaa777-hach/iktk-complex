server:
  port: 8083

spring:
  application:
    name: casting

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/iktk_casting
    username: ${POSTGRES_USER:iktk_app}
    password: ${POSTGRES_PASSWORD:iktk_dev_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:iktk}
    password: ${RABBITMQ_PASSWORD:iktk_dev_password}
    virtual-host: ${RABBITMQ_VHOST:/iktk}
    listener:
      simple:
        missing-queues-fatal: false

iktk:
  casting:
    default-method: SAND_CASTING
    min-wall-thickness: 3
    min-fillet-radius: 2
    min-draft-angle: 1
  equipment:
    url: http://localhost:8094
  integration:
    url: http://localhost:8090
  messaging:
    commands-queue: iktk.casting.queue
    results-queue: iktk.results