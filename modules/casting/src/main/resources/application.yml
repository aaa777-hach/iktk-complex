spring:
  application:
    name: casting
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:iktk}
    password: ${RABBITMQ_PASSWORD:iktk_dev_password}
    virtual-host: ${RABBITMQ_VHOST:/iktk}
    listener:
      simple:
        missing-queues-fatal: false
        default-requeue-rejected: false
  datasource:
    url: ${CASTING_DB_URL:jdbc:postgresql://localhost:5432/iktk_casting}
    username: ${CASTING_DB_USER:iktk_app}
    password: ${CASTING_DB_PASSWORD:iktk_dev_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

iktk:
  messaging:
    commands-exchange: iktk.commands
    routing-prefix: iktk.command
    commands-queue: iktk.casting.queue
    results-exchange: iktk.results
    results-queue: iktk.orchestrator.results.queue
  integration:
    url: ${INTEGRATION_URL:http://localhost:8092}
  equipment:
    url: ${EQUIPMENT_URL:http://localhost:8094}
  casting:
    demo-fallback: ${CASTING_DEMO_FALLBACK:true}
    result-exchange: ${CASTING_RESULT_EXCHANGE:iktk.results}
    result-routing-key: ${CASTING_RESULT_ROUTING_KEY:iktk.result.casting}
    result-send-max-attempts: ${CASTING_RESULT_SEND_MAX_ATTEMPTS:3}
    result-send-backoff-ms: ${CASTING_RESULT_SEND_BACKOFF_MS:500}

server:
  port: 8090

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
